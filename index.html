<title>Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bagel+Fat+One&family=Anton&family=Fraunces:opsz,wght@9..144,600&family=Bodoni+Moda:opsz,wght@6..96,700&family=Libre+Caslon+Text:wght@700&family=Syne:wght@800&display=swap">
<style>
:root{--acc:#1d2b8f;--acc-d:#111a5e;--acct:#1d2b8f;--on-acc:#f4f3ff;--gold:#ffb38a;--gold-d:#d9845a;--on-gold:#2a1408;
--bg:#f7f6ff;--card:#ffffff;--card2:#eceafd;--ink:#14163a;--muted:#5f6290;--line:#dcd9f6;--good:#2f7a4a;--red:#c0303a;--warn:#b07a10;
--desk:#dcd8ff;--floor:#f1efff;--wall:#c9c4f3;--f-ui:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;--f-sub:"Instrument Serif",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--acc:#2c3bb8;--acc-d:#151d6b;--acct:#ffb38a;--on-acc:#f4f3ff;--bg:#0b0d2a;--card:#151842;--card2:#1e2257;--ink:#eeedff;--muted:#a9acd8;--line:#2a2f6e;--good:#8fd6a5;--red:#ff8a93;--warn:#ffcf70;--desk:#2a2f6e;--floor:#121540;--wall:#343a85;color-scheme:dark}}
:root[data-theme="dark"]{--acc:#2c3bb8;--acc-d:#151d6b;--acct:#ffb38a;--on-acc:#f4f3ff;--bg:#0b0d2a;--card:#151842;--card2:#1e2257;--ink:#eeedff;--muted:#a9acd8;--line:#2a2f6e;--good:#8fd6a5;--red:#ff8a93;--warn:#ffcf70;--desk:#2a2f6e;--floor:#121540;--wall:#343a85;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body.ingame::before{background:var(--acc)}
#paperbg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;font:27px/1.55 var(--f-sub);color:var(--acct);opacity:.05;filter:blur(2.2px);padding:20px;text-align:justify}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
h2.sec{font:italic 400 19px/1.2 var(--f-sub);color:var(--acct);margin:16px 0 8px}
.meta{color:var(--muted);font-size:13px}
.kicker{font:italic 400 17px/1.2 var(--f-sub);color:var(--acct)}
/* boutons */
.btn{border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:15px;padding:12px 20px;box-shadow:0 4px 0 var(--acc-d);cursor:pointer;letter-spacing:-.01em}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--acc-d)}
.btn.ghost{background:var(--card);color:var(--acct);box-shadow:inset 0 0 0 2px var(--acct),0 3px 0 var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 var(--gold-d)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;border-radius:999px;background:var(--card);box-shadow:0 1px 0 var(--line);color:var(--acct);font-weight:700;font-size:13px;padding:9px 15px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 3px 0 var(--acc-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:0 0 12px}
.note{background:var(--card2);border-radius:16px;padding:12px 14px;font-size:14px;margin:0 0 12px}.note b{display:block;font:italic 400 16px/1.2 var(--f-sub);color:var(--acct);margin-bottom:4px}
.tag{display:inline-block;font:700 10.5px/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--card2);color:var(--muted);margin:0 4px 4px 0}
.tag.hot{background:var(--gold);color:var(--on-gold)}.tag.bad{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}.tag.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.bar{height:7px;border-radius:9px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acct);border-radius:9px}
.bar i.lo{background:var(--red)}.bar i.mid{background:var(--warn)}.bar i.hi{background:var(--good)}
.opbar{display:flex;align-items:center;gap:10px}.opbar .bar{flex:1}.opbar b{font-size:13px;min-width:26px;text-align:right}
/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--acc);color:var(--on-acc);border-radius:0 0 28px 28px;box-shadow:0 6px 0 var(--acc-d);margin:0 0 6px}
.top .wrap{padding-block:12px 12px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{display:inline-block;background:var(--on-acc);color:var(--acc);border-radius:16px;padding:6px 14px 8px}
.logo-s{font:700 24px/1 var(--f-ui);letter-spacing:-.055em}
.hdate{font:700 clamp(18px,5vw,26px)/1.05 var(--f-ui);letter-spacing:-.03em;margin-top:8px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hclock{font:700 34px/1 var(--f-ui);letter-spacing:-.05em}.hleft{font-size:12.5px;font-weight:600;opacity:.85}
.cont{border:0;border-radius:22px;background:var(--gold);color:var(--on-gold);box-shadow:0 5px 0 var(--gold-d);padding:9px 16px;text-align:right;font:700 21px/1.05 var(--f-ui);letter-spacing:-.03em;cursor:pointer;max-width:62vw}
.cont small{display:block;font-size:11.5px;font-weight:600;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
@media (min-width:700px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{background:rgba(255,255,255,.1);border-radius:16px;padding:8px 10px;color:var(--on-acc)}.tile b{display:block;font:italic 400 13px/1.2 var(--f-sub);opacity:.85}.tile span{font:700 19px/1.15 var(--f-ui);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hfoot{display:flex;align-items:center;gap:8px}.dprog{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}.dprog i{display:block;height:100%;background:var(--on-acc)}
.hib{border:0;background:rgba(255,255,255,.16);color:var(--on-acc);border-radius:999px;height:32px;min-width:32px;padding:0 12px;font-weight:700;font-size:12px;display:grid;place-items:center;cursor:pointer}
.hib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.hib.fill svg{fill:currentColor;stroke:none}.hib.on{background:var(--gold);color:var(--on-gold)}
.grab{align-self:center;border:0;background:rgba(255,255,255,.16);color:var(--on-acc);width:54px;height:20px;border-radius:999px;display:grid;place-items:center;margin:-4px 0 -6px;cursor:pointer}
.grab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4}.top.min .grab svg{transform:rotate(180deg)}.top.min .tiles,.top.min .hfoot{display:none}
/* onglets */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto;padding:14px 16px 120px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -1px 0 var(--line),0 -10px 30px -20px rgba(0,0,0,.4);padding:10px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabsi{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:1000px;margin:0 auto}.tabsi::-webkit-scrollbar{display:none}
.tab{flex:0 0 calc((100% - 30px)/5.4);min-width:64px;border:0;background:none;color:var(--acct);border-radius:22px;padding:11px 2px 10px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;cursor:pointer;white-space:nowrap}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--acc);color:var(--on-acc);box-shadow:0 4px 0 var(--acc-d)}
.badge{position:absolute;top:2px;right:6px;min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
@media (min-width:1000px){body{padding-left:116px}.tabs{top:0;right:auto;width:108px;bottom:0;border-radius:0;padding:18px 8px}.tabsi{flex-direction:column;overflow:visible}.tab{flex:none;padding:12px 4px}.shell{grid-template-columns:minmax(0,1fr) 330px}}
@media (min-width:600px) and (max-width:999px){.tabsi{overflow-x:visible}.tab{flex:1 1 0;min-width:0;font-size:11.5px}}
.side{display:none}@media (min-width:1000px){.side{display:block}}
/* guide */
.dsteps{display:flex;gap:4px;margin:0 0 10px;overflow-x:auto;scrollbar-width:none}.dsteps::-webkit-scrollbar{display:none}
.dstep{flex:1 0 auto;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--card);box-shadow:0 1px 0 var(--line);padding:7px 11px 7px 7px;font:700 12.5px/1 var(--f-ui);color:var(--muted);cursor:pointer}

  S={v:1,slot:su.slot||1,name:su.name,g:su.g,bg:su.bg,ag:{name:su.ag.name,font:su.ag.font,color:su.ag.color,slogan:su.ag.slogan,pos:su.ag.pos,city:su.ag.city},mode:su.mode||"expert",pace:su.pace||"pas",run:false,diff:su.diff||"normal",
   day:1,min:540,money:F[1],fin:su.fin,loan:{m:F[2],left:F[2]?60:0},over:su.fin==="pret"?30000:15000,rep:su.bg==="com"?28:18,crea:su.bg==="dc"?16:8,office:"cowork",
   staff:[],clients:[],projects:[],leads:[],pitches:[],invoices:[],msgs:[],calls:[],feed:[],agenda:{},cvs:[],free:[],prizes:[],trophies:{},hist:[],stat:{ca:0,caM:0,paidM:0,costM:0,del:0,won:0,lost:0},flags:{},seen:{},uid:1,tab:"red",sub:"",screen:"game",brief:1,energy:100,stress:10,neg:0};
  const bgsk={dc:{crea:8,craft:6,strat:5,client:5},com:{client:8,strat:5,crea:4,craft:3},strat:{strat:8,client:6,crea:5,craft:3},annonceur:{client:7,strat:7,crea:4,craft:3}}[su.bg];
  S.me={id:"me",n:su.name,g:su.g,av:su.av,sk:Object.assign({crea:3,strat:3,craft:3,client:3,digital:4,rp:3},bgsk),en:100,mood:80,proj:null,role:"dir",loc:"desk"};
  /* premier client : le réseau */
  const c=makeClient({size:1});c.sat=70;c.ty="confiant";c.tyT="Vous laisse travailler.";c.mod={rev:.6};S.clients.push(c);
  const p=makeProject(c.id,pick(["ident","rapport","rp","site"]),{days:14});S.projects.push(p);
  msg(c.contact.n,`Félicitations pour l’ouverture de ${su.ag.name}. Comme promis, je vous confie notre premier projet : ${p.n.toLowerCase()}. Budget : ${eur(p.fee)}. On compte sur vous.`);
  for(let i=0;i<2;i++)newLead("réseau");
  ["da","cr","cp"].forEach(r=>newCV(r));newCV(pick(["sm","pl","mo"]));

  if(su.fin==="invest")msg("Votre associé",`Ravi de cette aventure. Je regarderai les comptes chaque fin de mois. Pas d’inquiétude, je suis patient. Jusqu’à un certain point.`);
  ambient();save();
}

/* ---------- prospects ---------- */
function newLead(from,cid){
  const c=cid?client(cid):null;const pts=Object.keys(PT).filter(k=>k!=="crise"||Math.random()<.3);const pos=S.ag.pos;
  let pt=pick(pts);if(pos==="digital"&&Math.random()<.4)pt=pick(["site","social","influ"]);if(pos==="rp"&&Math.random()<.4)pt=pick(["rp","influ","crise","event"]);if(pos==="crea"&&Math.random()<.4)pt=pick(["affiche","film","ident"]);
  const need={film:40,lanc:22,affiche:18,event:12};if(need[pt]&&S.rep<need[pt]&&!(c&&c.size===3))pt=pick(["ident","rapport","rp","social","site","influ"]);
  const cc=c||makeClient(S.rep<25?{size:Math.random()<.75?1:2}:undefined);const L={id:"l"+(S.uid++),c:c?cc.id:null,cl:c?null:cc,pt,from,day:S.day,exp:S.day+rint(2,4),fee:0};
  const P=PT[pt],scale=[.75,1,1.35][cc.size-1];L.fee=Math.round(R(P.fee[0],P.fee[1])*scale/500)*500;S.leads.unshift(L);
  return L}
function newPitch(){const cc=makeClient({size:3});cc.ex=rint(60,85);const pt=pick(["film","lanc","affiche","site","event"]);const P=PT[pt];
  const rivals=shuffle(COMPET).slice(0,rint(2,4)).map(x=>x[0]);const fee=Math.round(R(P.fee[0],P.fee[1])*1.6/1000)*1000;
  const pi={id:"t"+(S.uid++),cl:cc,pt,fee,rivals,day:S.day,due:S.day+rint(6,10),prep:[{k:"strat",h:10,d:0},{k:"crea",h:16,d:0}],team:[],qs:0,qw:0,paid:Math.random()<.45?pick([2000,3000,5000]):0,status:"open",ret:Math.random()<.3};
  S.pitches.unshift(pi);msg("Veille appels d’offres",`${cc.n} lance une compétition pour ${P.n.toLowerCase()}. Budget estimé : ${eur(fee)}. ${pi.paid?`Indemnité de compétition : ${eur(pi.paid)}.`:"Compétition non rémunérée."} Agences consultées : ${rivals.join(", ")} et peut-être vous.`);return pi}
function acceptLead(id,fee){const L=S.leads.find(x=>x.id===id);if(!L)return;let c=L.c?client(L.c):null;if(!c){c=L.cl;S.clients.push(c)}
  const p=makeProject(c.id,L.pt,{fee:fee||L.fee});S.projects.push(p);S.leads=S.leads.filter(x=>x!==L);toast(`${c.n} : ${p.n.toLowerCase()} signé`);trophy("first");save();return p}

/* ---------- freelances et CV ---------- */
function genFree(){S.free=["da","cr","mo","dev","sm","rp"].map(r=>{const s=makeStaff(r,rint(1,2));s.rate=Math.round((ROLES[r].sal[1]/18)*R(1.6,2.2)/10)*10;s.fl=1;return s}).slice(0,5)}
function newCV(role){const lv=Math.random()<.45?0:Math.random()<.75?1:2;const s=makeStaff(role||pick(Object.keys(ROLES).filter(r=>r!=="dc"||Math.random()<.3)),lv);s.cv=1;s.day=S.day;s.floor=Math.round(s.sal*R(.86,.97)/50)*50;s.ask=s.sal;s.mood0=pick(["souple","ferme","pressé","joueur"]);s.round=0;s.perks=[];s.pf=Array.from({length:6},()=>pick(["#1d2b8f","#e8794a","#3f7a5a","#e0b100","#6b3fd4","#e5484d","#151515","#2f8ac9"]));S.cvs.unshift(s);S.cvs=S.cvs.slice(0,10)}
function capacity(){return OFFICES[S.office][1]}
function hired(){return active().filter(s=>!s.free).length}

/* ---------- messages ---------- */
function msg(from,txt){S.msgs.unshift({from,txt,t:T(S.min),d:S.day,read:false});S.msgs=S.msgs.slice(0,80)}
function feedPush(x){S.feed.unshift({t:T(S.min),x});S.feed=S.feed.slice(0,10)}
function ambient(){const ps=active().filter(s=>s.loc==="desk");if(!ps.length)return;const a=pick(ps),b=pick(ps);
  const pj=a.proj&&proj(a.proj);let t;
  if(pj&&Math.random()<.55){const c=client(pj.cid);const k=curPh(pj)?curPh(pj).k:"";t=pick({strat:[`${first(a)} épluche les études de marché de ${c.n}.`,`${first(a)} rédige la plateforme de marque de ${c.n}.`],crea:[`${first(a)} cherche une idée pour ${c.n}. Le mur est couvert de croquis.`,`${first(a)} teste trois accroches pour ${c.n} à voix haute.`],craft:[`${first(a)} finalise les fichiers d’exécution pour ${c.n}.`,`${first(a)} exporte la version 12 du projet ${c.n}.`],digital:[`${first(a)} programme les publications de ${c.n} pour la semaine.`,`${first(a)} corrige un bug sur le site de ${c.n}.`],rp:[`${first(a)} relance les journalistes pour ${c.n}.`,`${first(a)} met à jour le fichier presse de ${c.n}.`]}[k]||[`${first(a)} travaille sur ${c.n}.`])}
  else t=pick(AMB).replace("{a}",first(a)).replace("{b}",b===a?"un stagiaire":first(b));
  if(!S.feed.slice(0,5).some(f=>f.x===t))feedPush(t)}

/* ---------- le temps ---------- */
function eff(st,k){const sk=skillOf(st,k);let e=Math.pow(sk/7,1.15)*(0.45+st.en/180)*(0.82+(st.mood||60)/330);
  if(st.trait==="lent")e*=.8;if(st.trait==="star")e*=1.1;if(st.trait==="fiable")e*=1.03;if(st.boost===S.day)e*=1.15;
  const pos=POSITIONS[S.ag.pos][2];if(pos[k])e*=pos[k];if(S.bg==="dc"&&k==="crea")e*=1.08;if(S.flags.revue===S.day&&k==="crea")e*=1.05;return e}
function present(st){return st.id==="me"||(!st.left&&st.vac!==S.day&&st.vac2!==S.day&&S.min>=st.arr&&S.min<1140)}
function tick(silent){if(S.screen!=="game"||S.min>=1140)return;
  S.min+=30;const m=S.min;
  /* travail */
  S.projects.filter(p=>p.status==="work").forEach(p=>{const ph=curPh(p);if(!ph||ph.k==="pres")return;
    p.team.forEach(id=>{const st=stf(id);if(!st||!present(st)||st.en<=2)return;if(st.id==="me"&&S.meBusy)return;
      let e=eff(st,ph.k)*0.5*(p.crunch?1.3:1);ph.d+=e;p.qs+=skillOf(st,ph.k)*e;p.qw+=e;st.en=cl(st.en-(p.crunch?3.4:2.2));if(st.id!=="me")st.pub+=0});
    if(ph.d>=ph.h){p.i++;const nx=curPh(p);
      if(!nx){deliver(p)}
      else{if(nx.k==="craft"&&p.prod&&!p.prodPaid){S.money-=p.prod;p.prodPaid=1;S.stat.costM+=p.prod;feedPush(`Production lancée pour ${client(p.cid).n} : ${eur(p.prod)} d’achats (tournage, impression, régie).`)}
        if(nx.k==="pres"){p.status="pres";toast(`${client(p.cid).n} : prêt à présenter`);msg("Planning",`Le projet ${p.n.toLowerCase()} pour ${client(p.cid).n} est prêt à être présenté au client. Rendez-vous dans Projets.`)}}}});
  /* compétitions */
  S.pitches.filter(t=>t.status==="prep").forEach(t=>{const ph=t.prep.find(x=>x.d<x.h);if(!ph)return;t.team.forEach(id=>{const st=stf(id);if(!st||!present(st)||st.en<=2)return;const e=eff(st,ph.k)*.5;ph.d+=e;t.qs+=skillOf(st,ph.k)*e;t.qw+=e;st.en=cl(st.en-2.2)})});
  /* lieux */
  active().forEach(st=>{st.en=cl(st.en+(st.proj?0:0.6));
    if(st.vac===S.day||st.vac2===S.day||m<st.arr||m>=1140){st.loc="absent";return}
    const busy=S.projects.some(p=>p.team.includes(st.id)&&p.status!=="done")||S.pitches.some(t=>t.team.includes(st.id)&&t.status==="prep");st.proj=busy?(S.projects.find(p=>p.team.includes(st.id)&&p.status!=="done")||{}).id||null:null;
    if(m>=750&&m<810&&Math.random()<.6){st.loc="cafe";return}
    if(st.en<22){st.loc="cafe";return}
    if(S.meet===st.id||(S.meetT&&S.meetT.includes(st.id))){st.loc="meet";return}
    st.loc="desk"});
  S.me.en=cl(S.me.en-(S.me.proj?1.6:0.9));S.energy=S.me.en;if(m%120===0)S.stress=cl(S.stress+(S.money<0?3:0.6));
  if(Math.random()<.45)ambient();
  if(m>=1140){endDay();return}
  if(silent)return;
  const ag=S.agenda[m];if(ag&&!ag.done){ag.done=1;runAgenda(ag);return}
  if(m>=600&&m<=1080&&S.evToday<(isD()?1:3)&&Math.random()<({detendu:.05,normal:.07,exig:.09}[S.diff]||.07))randomEvent();
}
function adv(n){for(let i=0;i<n;i++){tick(false);if(S.screen!=="game"||!ov.hidden)break}save();render()}
function nextStop(){const L=[[600,"Point du matin"],[750,"Pause déjeuner"],[1080,"Fin de journée"]].concat(Object.entries(S.agenda).filter(([,a])=>!a.done).map(([t,a])=>[+t,a.label])).concat([[1140,"Fermeture"]]).filter(x=>x[0]>S.min).sort((a,b)=>a[0]-b[0]);return L[0]||[1140,"Fermeture"]}
function ffwd(){const [t]=nextStop();let g=0;while(S.min<t&&g<40){tick(false);g++;if(S.screen!=="game"||!ov.hidden)break}save();render()}

/* ---------- livraison et factures ---------- */
function payDays(c){return Math.round(c.pay*WD/30)+(c.ty==="mauvais payeur"&&!isD()?rint(8,20):0)}
function deliver(p){const c=client(p.cid);const q=quality(p);p.q=q;
  if(p.ret){/* récurrent : on attend l’échéance */p.status="wait";feedPush(`Le mois de ${c.n} est bouclé : contenus programmés.`);return}
  p.status="done";p.end=S.day;const late=Math.max(0,S.day-p.due);p.late=late;
  let s=55+(q-60)*0.7-late*6-p.rev*2+(c.ty==="confiant"?5:0);c.sat=Math.round(cl(c.sat*.4+cl(s)*.6));
  const amount=p.fee+Math.round(p.prod*1.15);invoice(c,amount,p.n);c.ca+=amount;c.hist.push({n:p.n,q,d:S.day});S.stat.del++;
  p.team.forEach(id=>{const st=stf(id);if(st&&st.id!=="me"){st.pub++;st.mood=cl(st.mood+(q>75?6:q<50?-4:2))}});
  if(q>=76&&["affiche","film","ident","lanc","event","influ","site"].includes(p.pt)){p.award=1}
  S.crea=cl(S.crea+(q-60)/12,0,100);S.rep=cl(S.rep+(c.sat-55)/14+(q-60)/25,0,100);
  msg(c.contact.n,c.sat>=75?`Bravo à toute l’équipe : ${p.n.toLowerCase()} dépasse nos attentes. On en parle déjà chez nous. Facture bien reçue.`:c.sat>=50?`Nous avons bien reçu le livrable. C’est correct. Facture transmise à la comptabilité.`:`Nous sommes déçus${late?", et en retard de "+late+" jour"+(late>1?"s":""):""}. Nous réglerons la facture, mais il faudra en reparler.`);
  toast(`Livré : ${p.n} pour ${c.n} · qualité ${q}`);trophy("deliv");if(q>=85)trophy("q85");
  if(c.sat>=68&&Math.random()<.55)setTimeout(()=>{},0),S.flags["upsell_"+c.id]=S.day+rint(3,8);
  p.team=[];
}
function invoice(c,amount,label){const inv={id:"f"+(S.uid++),cid:c.id,n:label,a:amount,day:S.day,due:S.day+payDays(c),paid:0,rel:0};S.invoices.unshift(inv);S.stat.caM+=amount;S.stat.ca+=amount;return inv}
function payInvoices(){S.invoices.filter(f=>!f.paid&&S.day>=f.due).forEach(f=>{const c=client(f.cid);let p=isD()?1:(c.ty==="mauvais payeur"?.35:.85)+f.rel*.15;if(Math.random()<p){f.paid=S.day;S.money+=f.a;S.stat.paidM+=f.a;feedPush(`Virement reçu : ${eur(f.a)} de ${c.n}.`)}})}

/* ---------- fin de journée, fin de mois ---------- */
function monthEnd(){return dateOf(S.day+1).getMonth()!==dateOf(S.day).getMonth()}
function costs(){const sal=active().filter(s=>!s.free).reduce((a,s)=>a+s.sal,0);const rent=Math.round(OFFICES[S.office][2]*CITIES[S.ag.city][1]);
  return {sal:Math.round(sal*1.45),rent,soft:90*(hired()+1),ins:350,loan:S.loan.left>0?S.loan.m:0,me:0}}
function endDay(){
  const N={day:S.day,lines:[],money0:S.flags.m0??S.money,del:S.projects.filter(p=>p.end===S.day).map(p=>({n:p.n,c:client(p.cid).n,q:p.q})),paid:0};
  /* freelances */
  const fr=active().filter(s=>s.free);fr.forEach(s=>{if(s.vac!==S.day){S.money-=s.rate;S.stat.costM+=s.rate}if(S.day>=s.free){s.left=1;S.projects.forEach(p=>p.team=p.team.filter(x=>x!==s.id));N.lines.push(`${s.n}, freelance, termine sa mission.`)}});
  /* retards */
  S.projects.filter(p=>p.status!=="done"&&p.status!=="wait"&&S.day>=p.due&&!p.ret).forEach(p=>{const c=client(p.cid);c.sat=cl(c.sat-(isD()?3:6));N.lines.push(`Retard sur ${p.n.toLowerCase()} pour ${c.n}. Le client s’impatiente.`)});
  /* récurrents */
  S.projects.filter(p=>p.ret&&S.day>=p.due&&p.status!=="done").forEach(p=>{const c=client(p.cid);const ok=p.status==="wait";if(ok){invoice(c,p.fee,p.n+" (mois)");c.sat=cl(c.sat+3);c.ca+=p.fee;N.lines.push(`Facture mensuelle émise pour ${c.n} : ${eur(p.fee)}.`)}else{c.sat=cl(c.sat-14);N.lines.push(`Le mois de ${c.n} n’a pas été tenu. Le client compte les publications manquantes.`);const part=Math.round(p.fee*pPct(p)*.8/50)*50;if(part>0)invoice(c,part,p.n+" (mois, partiel)")}
    if(c.sat<(isD()?20:35)){p.status="done";p.end=S.day;c.lost=1;msg(c.contact.n,"Nous mettons fin au contrat d’animation. Merci pour votre travail.");N.lines.push(`${c.n} résilie son contrat mensuel.`)}else{p.ph.forEach(x=>x.d=0);p.i=0;p.status="work";p.due=S.day+WD;p.month++}});
  const m0=S.money;payInvoices();N.paid=S.money-m0;
  /* nouvelles demandes */
  const rate=(0.18+S.rep/220)*(S.bg==="com"?1.3:1)*(S.ag.pos==="global"?1.1:1);if(Math.random()<rate)newLead(pick(["site internet","bouche-à-oreille","LinkedIn","recommandation"]));
  S.clients.forEach(c=>{if(S.flags["upsell_"+c.id]===S.day+1&&!c.lost){const L=newLead("client",c.id);msg(c.contact.n,`Nous aurions un nouveau besoin : ${PT[L.pt].n.toLowerCase()}. Vous êtes notre premier choix.`)}});
  if(Math.random()<(0.06+S.rep/900)&&S.pitches.filter(t=>t.status!=="done").length<3)newPitch();
  if(Math.random()<.35)newCV();
  S.leads=S.leads.filter(L=>{if(S.day>L.exp){N.lines.push(`Sans réponse de votre part, ${L.cl?L.cl.n:client(L.c).n} est allé voir ailleurs.`);return false}return true});
  /* compétitions à échéance */
  S.pitches.filter(t=>t.status==="prep"&&S.day>=t.due).forEach(t=>{t.status="ready"});
  /* fin de mois */
  if(monthEnd()){const C=costs();const tot=C.sal+C.rent+C.soft+C.ins+C.loan;S.money-=tot;S.stat.costM+=tot;if(S.loan.left>0)S.loan.left--;
    N.month={ca:S.stat.caM,paid:S.stat.paidM,cost:S.stat.costM,C,res:S.stat.paidM-S.stat.costM,name:cap(dateOf(S.day).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}))};
    S.hist.push({m:N.month.name,ca:S.stat.caM,res:N.month.res,money:S.money,team:hired()});
    if(S.fin==="invest"){if(N.month.res<0)S.flags.invBad=(S.flags.invBad||0)+1;else S.flags.invBad=0;msg("Votre associé",N.month.res>=0?`Mois positif : ${eur(N.month.res)}. Continuez comme ça.`:S.flags.invBad>=3?`Trois mois de pertes d’affilée. Je veux un plan de redressement sur mon bureau lundi.`:`Mois négatif : ${eur(N.month.res)}. Je m’inquiète un peu.`)}
    S.stat.caM=0;S.stat.paidM=0;S.stat.costM=0;active().forEach(s=>{if(!s.free&&s.mood<30&&Math.random()<.3&&!isD()){s.left=1;msg("Ressources humaines",`${s.n} a posé sa démission. Préavis d’un mois, mais la tête est déjà ailleurs.`)}});
    if(Math.random()<.5)genFree()}
  /* prix */
  if(S.day%35===0)festival(N);
  /* faillite */
  if(S.money<-S.over){S.neg++;N.lines.push(`Trésorerie sous le découvert autorisé. La banque vous appelle. Jour ${S.neg} sur 5.`)}else S.neg=0;
  if(S.neg>=5){S.screen="over";S.over_reason=`La banque coupe le découvert. Le tribunal de commerce prononce la liquidation de ${S.ag.name}.`;save();render();return}
  /* énergie */
  active().forEach(s=>{s.en=cl(s.en+48);s.mood=cl(s.mood+(62-s.mood)*.12-(s.en<30?3:0))});S.me.en=cl(S.me.en+55);S.stress=cl(S.stress-12);
  N.money=S.money;N.dm=S.money-N.money0;S.night=N;S.screen="night";S.flags.m0=S.money;checkTrophies();save();render()}
function startDay(){S.day++;S.min=540;S.evToday=0;S.agenda={};S.flags.m0=S.money;S.meetT=null;S.screen="game";
  if(dateOf(S.day).getDay()===1&&S.day>1)msg("Planning",`Nouvelle semaine. ${S.projects.filter(p=>p.status!=="done").length} projets en cours, ${S.leads.length} demande${S.leads.length>1?"s":""} en attente.`);
  genInvites();save();render()}

/* ---------- prix ---------- */
const FESTS=["Les Flèches d’or","Le Grand Prix de la création indépendante","Les Trophées de l’efficacité"];
function festival(N){const el=S.projects.filter(p=>p.award===2);const f=FESTS[Math.floor(S.day/35)%3];
  if(!el.length){N.lines.push(`${f} : aucune inscription de votre agence cette fois.`);return}
  el.forEach(p=>{const c=client(p.cid);const sc=p.q+S.crea/5+R(-12,12);const met=sc>=96?"or":sc>=88?"argent":sc>=80?"bronze":null;p.award=3;
    if(met){S.prizes.push({f,m:met,n:p.n,c:c.n,d:S.day});S.rep=cl(S.rep+({or:10,argent:6,bronze:3})[met]);S.crea=cl(S.crea+({or:10,argent:6,bronze:3})[met]);N.lines.push(`${f} : ${met} pour ${p.n.toLowerCase()} (${c.n}) ! L’équipe fête ça jusqu’à minuit.`);active().forEach(s=>s.mood=cl(s.mood+8));trophy("prix")}

let AC=null,BUS=null,MUS=null;
function ac(){if(!PREFS.sound)return null;if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();BUS=AC.createGain();BUS.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=0;MUS.connect(BUS)}catch(e){return null}}if(AC.state==="suspended")AC.resume();return AC}
function blip(f,d,v,t0){const a=ac();if(!a)return;const t=(t0||a.currentTime)+.005,o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*(PREFS.vfx/100),t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(BUS);o.start(t);o.stop(t+d+.05)}
function uiSound(k){try{if(!PREFS.sound||!AC)return;const t=AC.currentTime;({tap:()=>blip(1500,.05,.05),btn:()=>{blip(880,.07,.06);blip(1320,.09,.035,t+.035)},open:()=>{blip(523,.18,.05);blip(784,.24,.045,t+.07)},ping:()=>{blip(1568,.2,.035);blip(2093,.16,.02,t+.05)},good:()=>[659,784,988,1319].forEach((f,i)=>blip(f,.3,.045,t+i*.07)),cash:()=>[1320,1760].forEach((f,i)=>blip(f,.15,.05,t+i*.08))})[k]()}catch(e){}}
let NEXTPAD=0,PADI=0;const PADS=[[146.8,220,277.2,329.6],[123.5,185,246.9,311.1],[110,164.8,220,277.2],[130.8,196,261.6,329.6]];
setInterval(()=>{try{if(!AC||!PREFS.sound||document.hidden)return;const now=AC.currentTime;MUS.gain.setTargetAtTime(PREFS.music&&S&&S.screen==="game"?.6*(PREFS.vmus/100):0,now,1);
  if(PREFS.music&&now>=NEXTPAD-.2){const t=Math.max(now,NEXTPAD);PADS[PADI++%4].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=i?"triangle":"sine";o.frequency.value=f;const v=i?.022:.05;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+2);g.gain.setValueAtTime(v,t+5.5);g.gain.linearRampToValueAtTime(0,t+7.6);o.connect(g).connect(MUS);o.start(t);o.stop(t+8)});NEXTPAD=t+7.5}}catch(e){}},500);
document.addEventListener("pointerdown",e=>{try{if(!PREFS.sound)return;ac();const el=e.target.closest("button");if(!el||el.disabled)return;uiSound(el.classList.contains("tab")||el.classList.contains("btn")?"btn":"tap")}catch(err){}},true);

const TABS={};
function guide(){
  const pres=S.projects.find(p=>p.status==="pres");if(pres)return {t:"Un projet est prêt à présenter",d:`${client(pres.cid).n} attend vos propositions. C’est vous qui présentez.`,b:["Présenter","pres:"+pres.id]};
  const rdy=S.pitches.find(t=>t.status==="ready");if(rdy)return {t:"Jour de compétition",d:`${rdy.cl.n} vous attend pour la présentation.`,b:["Y aller","pitch:"+rdy.id]};
  const lead=S.leads[0];if(lead)return {t:`${S.leads.length} demande${S.leads.length>1?"s":""} de client${S.leads.length>1?"s":""}`,d:"Acceptez, négociez ou refusez. Elles expirent vite.",b:["Voir les prospects","pros"]};
  const nos=S.projects.find(p=>p.status==="work"&&!p.team.length);if(nos)return {t:"Un projet sans équipe",d:`Personne ne travaille sur ${nos.n.toLowerCase()} pour ${client(nos.cid).n}.`,b:["Staffer","proj"]};
  const late=S.invoices.find(f=>!f.paid&&S.day>f.due);if(late)return {t:"Une facture en retard",d:`${client(late.cid).n} vous doit ${eur(late.a)}.`,b:["Voir les factures","fin"]};
  if(!hired()&&S.cvs.length)return {t:"Recrutez votre première recrue",d:"Seul, vous n’irez pas loin. Des candidatures vous attendent.",b:["Voir les candidatures","team:cv"]};
  return {t:"L’agence tourne",d:"Laissez le temps avancer, ou allez chercher de nouveaux clients.",b:["Prospects","pros"]}}
function steps(){const L=[["Prospecter","pros",!S.leads.length],["Staffer","proj",!S.projects.some(p=>p.status==="work"&&!p.team.length)],["Présenter","proj",!S.projects.some(p=>p.status==="pres")],["Livrer","proj",S.projects.some(p=>p.end===S.day)],["Encaisser","fin",!S.invoices.some(f=>!f.paid&&S.day>f.due)]];let cur=L.findIndex(x=>!x[2]);return `<div class="dsteps">${L.map(([n,go,ok],i)=>`<button class="dstep${ok?" ok":""}${i===cur?" cur":""}" data-go="${go}"><i>${ok?"✓":i+1}</i>${n}</button>`).join("")}</div>`}
function guideHtml(){const g=guide();return steps()+`<div class="guide"><b>À faire maintenant</b><strong>${esc(g.t)}</strong><p>${esc(g.d)}</p>${g.b?`<button class="btn" data-go="${g.b[1]}">${esc(g.b[0])}</button>`:""}</div>`}

function chip(id,p,on){const st=stf(id);const busy=id!=="me"&&S.projects.some(x=>x!==p&&x.status!=="done"&&x.team.includes(id));const k=curPh(p)?curPh(p).k:"crea";const sk=skillOf(st,k==="pres"?"client":k);const off=id!=="me"&&(st.vac===S.day||st.vac2===S.day);

function pjCard(p){const c=client(p.cid);const left=p.due-S.day;const q=quality(p);
  const ph=p.ph.map((x,i)=>`<div class="ph${i<p.i?" done":""}${i===p.i&&p.status!=="done"?" cur":""}">${x.k!=="pres"?`<i style="width:${Math.min(100,x.d/x.h*100)}%"></i>`:""}<span>${PHN[x.k]}</span></div>`).join("");
  const ppl=["me"].concat(active().map(s=>s.id)).sort((a,b)=>(p.team.includes(b)?1:0)-(p.team.includes(a)?1:0));
  return `<div class="pj"><div class="row"><div><span class="tag">${esc(SECTORS[c.sec][0])}</span>${p.ret?'<span class="tag hot">Mensuel</span>':""}${PT[p.pt].urg?'<span class="tag bad">Urgent</span>':""}<h3>${esc(p.n)}</h3><div class="meta">${esc(c.n)} · ${eur(p.fee)}${p.prod?" + production "+eur(p.prod):""} · ${p.status==="wait"?"mois bouclé, facture le "+dstr(p.due,{day:"numeric",month:"short"}):left>=0?"livraison dans "+left+" j":"<b class='down'>en retard de "+(-left)+" j</b>"}</div></div></div>
   <div class="phases">${ph}</div>

function autoTeam(p){const k=curPh(p)?curPh(p).k:"crea";const free=active().filter(s=>!S.projects.some(x=>x!==p&&x.status!=="done"&&x.team.includes(s.id)));free.sort((a,b)=>skillOf(b,k)-skillOf(a,k));p.team=free.slice(0,p.ph.reduce((a,x)=>a+x.h,0)<160?1:2).map(s=>s.id);if(!p.team.length)p.team=["me"]}
function openPres(p){if(!p)return;const c=client(p.cid);const q=quality(p);const lead=p.team.map(stf).filter(s=>s&&s.id!=="me").sort((a,b)=>skillOf(b,"client")-skillOf(a,"client"))[0];
  openModal(`<div class="ev-k">Présentation · salle de réunion de ${esc(c.n)}</div><h3 class="ev-t">${esc(p.n)}</h3>
   <div class="from">${fc(c.contact.av,60)}<div><div class="who">${esc(c.contact.n)}</div><div class="wr">${esc(c.contact.r)} · client ${esc(c.ty)} : ${esc(c.tyT.toLowerCase())}</div></div></div>
   <p class="ev-x">Qualité du travail : ${q}/100. Exigence du client : ${c.ex}/100. Comment présentez-vous ?</p>
   <div class="abc"><button class="abc-b" data-pv="one"><span class="abc-l">A</span><span><b>Une seule piste, forte</b><small>Ça passe ou ça casse</small></span></button>
    <button class="abc-b" data-pv="three"><span class="abc-l">B</span><span><b>Trois pistes, de la plus sage à la plus audacieuse</b><small>Plus sûr, mais la production sera plus longue</small></span></button>
    ${lead?`<button class="abc-b" data-pv="lead"><span class="abc-l">C</span><span><b>Laisser ${esc(first(lead))} présenter</b><small>Relation client ${stars(skillOf(lead,"client"))}</small></span></button>`:""}</div>`);
  sheet.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>{const v=b.dataset.pv;let sc=q+S.rep/8-c.ex+R(-12,12)+(isD()?12:0)+(S.bg==="strat"?4:0)+(S.bg==="annonceur"?3:0);
    if(v==="one"){sc+=c.ty==="audacieux"?14:R(-12,14)}if(v==="three"){sc+=6;p.ph[p.ph.length-1].h=Math.round(p.ph[p.ph.length-1].h*1.2)}if(v==="lead")sc+=(skillOf(lead,"client")-5)*3;
    const rv=(c.mod&&c.mod.rev)||1;let r;
    if(sc>=10){r=`« C’est exactement ça. On valide. » ${c.contact.n} serre toutes les mains. La production peut commencer.`;c.sat=cl(c.sat+4);p.i++;p.status="work"}
    else if(sc>=-4){const add=Math.round(p.ph[p.i-1].h*.25*rv*(isD()?.5:1));p.i--;p.ph[p.i].h+=add;p.status="work";p.rev++;r=`« On y est presque. Quelques ajustements. » Retours mineurs : ${add} heures de création en plus.`}
    else if(sc>=-18){const add=Math.round(p.ph[p.i-1].h*.6*rv*(isD()?.5:1));p.i--;p.ph[p.i].h+=add;p.status="work";p.rev++;c.sat=cl(c.sat-4);r=`« Ce n’est pas ce qu’on avait demandé. » Retours importants : ${add} heures de création en plus.`}
    else{p.i--;p.ph[p.i].d=0;p.qs=0;p.qw=0;p.status="work";p.rev++;c.sat=cl(c.sat-10);r=`Un long silence. « On repart de zéro. » La création est à refaire.`}
    S.me.en=cl(S.me.en-6);adv0(2);save();showCard("Présentation",r,c.n)})}

function openNegLead(id){const l=S.leads.find(x=>x.id===id);const c=l.c?client(l.c):l.cl;
  openModal(`<div class="ev-k">Négociation · ${esc(c.n)}</div><h3 class="ev-t">le budget</h3><p class="ev-x">${esc(c.contact.n)} propose ${eur(l.fee)}. Que répondez-vous ?</p>
   <div class="abc">${[[1,"« C’est parfait. »","Signé tout de suite"],[1.12,"« Il faudrait 12 % de plus. »","Raisonnable"],[1.3,"« Pour bien faire, c’est 30 % de plus. »","Ambitieux"]].map(([m,t,d],i)=>`<button class="abc-b" data-m="${m}"><span class="abc-l">${"ABC"[i]}</span><span><b>${t}</b><small>${eur(Math.round(l.fee*m/500)*500)} · ${d}</small></span></button>`).join("")}</div>`);

    const p=(m<1.2?.75:.4)+(c.sat-60)/120+(S.rep-30)/200+(S.bg==="com"?.1:0);if(Math.random()<p){acceptLead(id,fee);showCard("Négociation",`« Vous savez défendre votre travail. D’accord pour ${eur(fee)}. »`)}else if(Math.random()<.5){acceptLead(id,l.fee);showCard("Négociation",`« Nous en restons à ${eur(l.fee)}. C’est à prendre ou à laisser. » Vous prenez.`)}else{S.leads=S.leads.filter(x=>x!==l);showCard("Négociation","« Nous allons voir ailleurs. » Le prospect raccroche.")}})}
function openPitchPres(t){if(!t)return;const pr=t.prep.reduce((a,x)=>a+Math.min(x.d,x.h),0)/t.prep.reduce((a,x)=>a+x.h,0);const q=t.qw?30+t.qs/t.qw*6.5:50;

    if(win){S.clients.push(t.cl);const p=makeProject(t.cl.id,t.pt,{fee:v==="prix"?Math.round(t.fee*.85/500)*500:t.fee});S.projects.push(p);S.stat.won++;S.rep=cl(S.rep+4);trophy("pitch");active().forEach(s=>s.mood=cl(s.mood+6));uiSound("good");showCard("Compétition",`Le téléphone sonne à 18 h 40. « Vous avez gagné. » ${t.cl.n} vous confie ${PT[t.pt].n.toLowerCase()}, ${eur(p.fee)}. L’agence explose de joie.${t.paid?" Indemnité encaissée : "+eur(t.paid)+".":""}`,"gagné")}
    else{S.stat.lost++;showCard("Compétition",`Un courriel, trois jours plus tard : « Nous avons retenu ${pick(t.rivals)}. Votre travail était très apprécié. »${t.paid?" Indemnité encaissée : "+eur(t.paid)+".":""}`,"perdu")}

  sheet.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const k=b.dataset.pk;s.perks=s.perks.includes(k)?s.perks.filter(x=>x!==k):s.perks.concat(k);openNego(id,log)});

    s.counter=Math.round((fl+s.ask)/2/50)*50;log.push(({souple:"« On peut se retrouver à mi-chemin : ",ferme:"« Je ne descendrai pas sous ",pressé:"« J’ai une autre offre. Disons ",joueur:"« Faisons un geste chacun : "})[s.mood0]+eur(s.counter)+" brut. »");openNego(id,log)});

TABS.fin=function(){const C=costs();const tot=C.sal+C.rent+C.soft+C.ins+C.loan;const pend=S.invoices.filter(f=>!f.paid);const late=pend.filter(f=>S.day>f.due);

   <div class="card"><b>Charges de fin de mois</b><div class="meta" style="margin-top:6px">Salaires chargés ${eur(C.sal)} · loyer ${eur(C.rent)} · logiciels ${eur(C.soft)} · assurances ${eur(C.ins)}${C.loan?" · prêt "+eur(C.loan):""}</div><div style="font:700 22px var(--f-ui);margin-top:6px">${eur(tot)}</div><div class="meta">Prélevées le dernier jour ouvré du mois. ${S.money-tot<-S.over?"<b class='down'>Attention : la trésorerie ne suffira pas.</b>":""}</div></div>

   ${H.length?`<h2 class="sec">Résultat des derniers mois</h2><div class="card">${H.map(h=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:110px;font-size:12.5px">${esc(h.m)}</span><div style="flex:1;display:flex;${h.res<0?"justify-content:flex-end;":""}"><i style="display:block;height:12px;border-radius:6px;width:${Math.abs(h.res)/mx*100}%;background:${h.res<0?"var(--red)":"var(--good)"}"></i></div><b style="width:80px;text-align:right;font-size:12.5px" class="${h.res<0?"down":"up"}">${keur(h.res)}</b></div>`).join("")}</div>`:""}
   ${S.loan.left?`<p class="meta">Prêt bancaire : ${S.loan.left} mensualités restantes de ${eur(S.loan.m)}.</p>`:""}`};
BIND.fin=function(){app.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>{const f=S.invoices.find(x=>x.id===b.dataset.rel);f.rel++;const c=client(f.cid);if(Math.random()<.35+f.rel*.12){f.paid=S.day;S.money+=f.a;S.stat.paidM+=f.a;uiSound("cash");toast(`${c.n} a payé ${eur(f.a)}`)}else toast("Relance envoyée");c.sat=cl(c.sat-1);adv0(1);save();render()})};

function callMenu(name,role,av,opts){dial(name,role,av,()=>{const L=opts.filter(o=>!o.ok||o.ok());openModal(`<div class="ev-k">Téléphone · ${T(S.min)}</div><div class="from">${av?fc(av):`<span class="mav">${esc(name.charAt(0))}</span>`}<div><div class="who">${esc(name)}</div><div class="wr">${esc(role||"")}</div></div></div><h3 class="ev-t">que lui dites-vous ?</h3><div class="abc">${L.map((o,i)=>`<button class="abc-b" data-co="${i}"><span class="abc-l">${"ABCDE"[i]}</span><span><b>${esc(o.t)}</b>${o.d?`<small>${esc(o.d)}</small>`:""}</span></button>`).join("")}</div><button class="btn ghost" id="cl" style="margin-top:12px">raccrocher</button>`);

function callClient(c){const f=S.invoices.find(x=>!x.paid&&x.cid===c.id&&S.day>x.due);const lateP=S.projects.find(p=>p.cid===c.id&&p.status!=="done"&&S.day>p.due);
  callMenu(c.contact.n,c.contact.r+" · "+c.n,c.contact.av,[
   {t:"« Je voulais prendre de vos nouvelles. »",d:"Satisfaction +4, une fois par semaine",ok:()=>(c.called||-9)<S.day-4,f(){c.called=S.day;c.sat=cl(c.sat+4);return "« C’est gentil d’appeler sans rien vendre. Ça change. »"}},
   {t:"« Vous auriez d’autres besoins en ce moment ? »",d:"Une nouvelle demande si le client est content",ok:()=>c.sat>=55&&(c.ask||-9)<S.day-5,f(){c.ask=S.day;if(Math.random()<(c.sat-40)/60){newLead("client",c.id);return "« Justement, on réfléchissait à quelque chose. Je vous envoie le brief. » Une demande arrive dans Prospects."}return "« Pas pour l’instant, mais je pense à vous. »"}},
   {t:"« À propos de notre facture… »",d:f?`${eur(f.a)}, en retard de ${S.day-f.due} j`:"",ok:()=>!!f,f(){f.rel+=2;if(Math.random()<.45+(c.sat-50)/150){f.paid=S.day;S.money+=f.a;S.stat.paidM+=f.a;uiSound("cash");return "« Désolé, c’était resté sur un bureau. Je le débloque. » Le virement arrive."}c.sat=cl(c.sat-2);return "« C’est en cours de validation. » Vous connaissez la chanson."}},
   {t:"« Je vous dois des excuses pour le retard. »",d:"Satisfaction +6",ok:()=>!!lateP&&lateP.sorry!==S.day,f(){lateP.sorry=S.day;c.sat=cl(c.sat+6);return "« Merci de le dire. Tenez-moi au courant chaque jour. »"}}])}

function rankList(){const me={n:S.ag.name,ca:S.stat.ca/1000*(260/Math.max(20,S.day)),cr:S.crea,me:1};const L=COMPET.map(([n,ca,cr])=>({n,ca:ca*1000/12*(1+Math.sin(S.day/30+n.length)*.05),cr}));L.forEach(x=>x.ca=x.ca*1);return L.concat([{n:S.ag.name,ca:S.stat.ca/Math.max(1,S.day)*WD,cr:S.crea,me:1}]).sort((a,b)=>(b.cr*.5+b.ca/2000)-(a.cr*.5+a.ca/2000))}
TABS.ag=function(){const sub=S.sub||"id";const seg=`<div class="seg">${[["id","L’agence"],["tarif","Tarifs"],["loc","Locaux"],["rank","Classement"],["pal","Palmarès"]].map(([k,l])=>`<button data-sub="${k}" class="${sub===k?"on":""}">${l}</button>`).join("")}</div>`;
  if(sub==="loc")return seg+Object.entries(OFFICES).map(([k,[n,c,r,d]])=>`<div class="pj"><h3>${n}${S.office===k?" · vos locaux":""}</h3><div class="meta">${d}</div><p>${c} postes · loyer ${eur(Math.round(r*CITIES[S.ag.city][1]))} par mois</p>${S.office!==k&&c>OFFICES[S.office][1]?`<button class="btn sm" data-move="${k}">déménager · ${eur(Math.round(r*CITIES[S.ag.city][1]*3+c*800))}</button>`:""}</div>`).join("");

/* =================== Le métier, plus loin =================== */
const BRIEFOBJ={ident:["Moderniser l’image sans perdre les clients historiques.","Donner une identité claire à une marque qui s’est dispersée.","Préparer une levée de fonds avec une image plus solide."],
 affiche:["Faire connaître la marque dans trois grandes villes.","Relancer les ventes d’un produit vieillissant.","Annoncer une nouvelle gamme avant l’été."],
 film:["Un film de trente secondes pour la télévision et les réseaux.","Raconter l’histoire de la marque en une minute.","Un film de recrutement pour attirer des profils rares."],
 site:["Refondre un site lent et difficile à mettre à jour.","Vendre en ligne, sans intermédiaire.","Un site qui génère des demandes de devis."],
 social:["Publier régulièrement, avec une vraie ligne éditoriale.","Rajeunir l’audience sur Instagram.","Faire de LinkedIn un outil de recrutement."],
 rp:["Obtenir des articles dans la presse nationale.","Installer le dirigeant comme expert de son secteur.","Faire parler des vingt ans de la marque."],
 lanc:["Lancer un nouveau produit en six semaines.","Réussir l’arrivée de la marque en France.","Faire du lancement un événement dont on parle."],
 event:["Une soirée pour trois cents clients et partenaires.","Un séminaire qui redonne de l’élan aux équipes.","Un stand qu’on remarque sur le salon de l’année."],
 crise:["Répondre à un article à charge paru ce matin.","Gérer un rappel de produit sans perdre la confiance.","Calmer une polémique née sur les réseaux sociaux."],
 rapport:["Un rapport annuel lisible, pas seulement conforme.","Rendre les chiffres de l’année compréhensibles par tous.","Mettre en valeur les engagements environnementaux."],
 influ:["Une campagne avec une dizaine de créateurs de contenu.","Toucher les 18-25 ans là où ils sont vraiment.","Faire essayer le produit avant sa sortie."]};
const CIBLES=["Les 25-40 ans des grandes villes","Les familles avec enfants","Les décideurs en entreprise","Les seniors actifs","Les étudiants","Les clients historiques de la marque","Les professionnels du secteur"];
const CONTR=[["Un comité de direction à convaincre","rev"],["Une date qui ne bougera pas","date"],["Une charte graphique très stricte",""],["Un budget média limité",""],["Un concurrent qui vient de faire parler de lui",""],["Trois interlocuteurs qui ne sont pas d’accord entre eux","rev"],["Aucune contrainte particulière, pour une fois",""]];
const SIZEN=["","PME","Entreprise de taille moyenne","Grand groupe"];
const TARIFS={bas:["Serrés","Taux horaire autour de 75 €. Plus de demandes, des budgets plus petits.",.85],std:["Du marché","Taux horaire autour de 100 €. L’équilibre.",1],premium:["Premium","Taux horaire autour de 140 €. Moins de demandes, des budgets plus gros, des clients plus exigeants.",1.25]};
function makeBrief(L){const c=L.c?client(L.c):L.cl;const k=pick(CONTR);return {o:pick(BRIEFOBJ[L.pt]||["Faire mieux que l’an dernier."]),c:c&&c.sec==="coll"?"Les habitants du territoire":pick(CIBLES),k:k[0],kf:k[1]}}
function briefHtml(b){return b?`<div class="brf"><div><small>Objectif</small>${esc(b.o)}</div><div><small>Cible</small>${esc(b.c)}</div><div><small>Contrainte</small>${esc(b.k)}</div></div>`:""}
function rival(c){if(!c)return null;return S.clients.find(x=>x!==c&&!x.lost&&x.sec===c.sec&&(x.ca>0||S.projects.some(p=>p.cid===x.id&&p.status!=="done")))}
function trust(v){return v<40?"fragile":v<60?"correcte":v<80?"bonne":"excellente"}

/* demandes : tarifs, brief, conflits */
const _newLeadP=newLead;
newLead=function(from,cid){const L=_newLeadP(from,cid);if(!L)return L;const t=TARIFS[S.tarif||"std"];L.fee=Math.max(1500,Math.round(L.fee*t[2]/500)*500);if(!L.c&&S.tarif==="premium")L.cl.ex=Math.min(95,L.cl.ex+6);L.bf=makeBrief(L);return L};
const _acceptLeadP=acceptLead;
acceptLead=function(id,fee){const L=S.leads.find(x=>x.id===id);if(!L)return;const nc=L.c?null:L.cl;const rv=rival(nc);const bf=L.bf;const p=_acceptLeadP(id,fee);if(!p)return p;p.bf=bf;
  if(bf&&bf.kf==="date")p.strict=1;if(bf&&bf.kf==="rev"){const c=client(p.cid);c.mod=Object.assign({},c.mod||{},{rev:((c.mod&&c.mod.rev)||1)*1.2})}
  if(rv){rv.sat=cl(rv.sat-8);msg(rv.contact.n,`J’apprends que vous travaillez désormais pour ${nc.n}. C’est notre concurrent direct. Je ne vous cache pas que cela me pose un problème.`)}
  save();return p};
const _endDayP=endDay;
endDay=function(){const r=_endDayP.apply(this,arguments);try{
  if(S.tarif==="premium"){const L=S.leads.filter(l=>l.day===S.day&&!l.c&&l.from!=="prospection"&&l.from!=="réseau");if(L.length&&Math.random()<.35)S.leads=S.leads.filter(x=>x!==L[0])}
  if(S.tarif==="bas"&&Math.random()<.12)newLead("bouche-à-oreille");
  S.projects.filter(p=>p.strict&&p.status!=="done"&&S.day>p.due).forEach(p=>{const c=client(p.cid);c.sat=cl(c.sat-4)})}catch(e){}return r};

/* le temps passé coûte */
const _tickP=tick;
tick=function(silent){const m0=S.min,d0=S.day;const r=_tickP(silent);try{if(S.min!==m0&&S.day===d0){
  S.projects.forEach(p=>{if(p.status!=="work")return;p.team.forEach(id=>{if(id==="me"){p.cost=(p.cost||0)+22.5;return}const st=stf(id);if(!st||!present(st)||st.loc==="absent")return;p.cost=(p.cost||0)+(st.free?st.rate/7:st.sal*1.45/150)*.5})})}}catch(e){}return r};
function marge(p){const c=p.cost||0;return p.fee?Math.round((p.fee-c)/p.fee*100):0}
function margeHtml(p){if(!p.cost)return "";const m=marge(p);return ` · temps passé ${eur(Math.round(p.cost))} · <span class="${m<20?"down":m>=50?"up":""}">marge ${m} %</span>`}
const _pjCardP=pjCard;
pjCard=function(p){let h=_pjCardP(p);h=h.replace(/(<div class="meta">Avancement [^<]*)(<\/div>)/,(m,a,b)=>a+margeHtml(p)+b);if(p.bf)h=h.replace('<div class="phases">',`<div class="meta" style="margin:-2px 0 8px">${esc(p.bf.o)}</div><div class="phases">`);return h};

/* prospects : démarcher, voir le brief */
const _prosP=TABS.pros;
TABS.pros=function(){let h=_prosP();
  S.leads.forEach(l=>{const c=l.c?client(l.c):l.cl;const rv=l.c?null:rival(c);h=h.replace(`<div class="acts"><button class="btn sm" data-acc="${l.id}"`,briefHtml(l.bf)+(rv?`<div class="note warn">Concurrent direct de ${esc(rv.n)}, votre client. Il risque de mal le prendre.</div>`:"")+`<div class="acts"><button class="btn sm" data-acc="${l.id}"`)});
  const n=S.flags.demD===S.day?S.flags.demN:0;
  const dem=`<div class="card"><b>Démarcher une entreprise</b><div class="meta">Une heure au téléphone et sur LinkedIn. Trois tentatives par jour${n?" · "+(3-n)+" restante"+(3-n>1?"s":""):""}. Dans quel secteur ?</div><div class="seg" style="flex-wrap:wrap;margin-top:8px">${Object.entries(SECTORS).map(([k,s])=>`<button data-dem="${k}" ${n>=3?"disabled":""}>${esc(s[0])}</button>`).join("")}</div></div>`;const i=h.indexOf('<h2 class="sec">Compétitions');return i<0?h+dem:h.slice(0,i)+dem+h.slice(i)};
const _bindProsP=BIND.pros;
BIND.pros=function(){_bindProsP();app.querySelectorAll("[data-dem]").forEach(b=>b.onclick=()=>{if(S.flags.demD!==S.day){S.flags.demD=S.day;S.flags.demN=0}if(S.flags.demN>=3)return;S.flags.demN++;const sec=b.dataset.dem;
  const ch=.22+S.rep/250+(S.bg==="com"?.1:0)+(S.tarif==="bas"?.06:S.tarif==="premium"?-.06:0);adv0(2);S.me.en=cl(S.me.en-4);
  if(Math.random()<ch){const L=newLead("prospection");const nc=makeClient({sec,size:S.rep<25?(Math.random()<.75?1:2):undefined});L.cl=nc;L.c=null;L.bf=makeBrief(L);const P0=PT[L.pt];L.fee=Math.max(1500,Math.round(R(P0.fee[0],P0.fee[1])*[.75,1,1.35][nc.size-1]*TARIFS[S.tarif||"std"][2]/500)*500);save();
    showCard("Prospection",`« ${pick(["Votre timing est bon : on cherche justement quelqu’un.","Envoyez-moi une proposition, je la lirai.","On n’est pas très contents de notre agence actuelle, pour tout vous dire."])} » ${nc.contact.n}, ${nc.contact.r.toLowerCase()} chez ${nc.n}, vous envoie un brief. Il est dans vos demandes.`,"une piste")}

  if(P.phase==="home"){app.innerHTML=`<div class="screen home"><div class="wrap"><div class="screen-top"><span></span>${thm}</div>
    <div class="poster" role="img" aria-label="Pas d’idée, pas de client."><span>pas<br>d’idée,</span><span class="r">pas de<br>client.</span></div>
    <div><div class="logo-big">brief.</div><button class="btn big" id="go0" style="width:100%;margin-top:18px">continuer</button></div><p class="sign">par pierrette</p></div></div>`;
    document.getElementById("thm").onclick=cycleTheme;document.getElementById("go0").onclick=()=>{P.phase="slots";render();window.scrollTo(0,0)};return}
  if(P.phase==="slots"){app.innerHTML=`<div class="screen"><div class="wrap"><div class="screen-top"><button class="btn ghost sm" id="bk0">retour</button><div style="display:flex;gap:8px"><button class="ib" id="gr" aria-label="Réglages"><svg viewBox="0 0 24 24">${IC.gear}</svg></button>${thm}</div></div>
    <h1 class="q">vos agences</h1>${slotsHtml()}<p class="meta" style="margin-top:14px">Les agences, les marques, les clients et tous les personnages du jeu sont fictifs.</p></div></div>`;
    document.getElementById("thm").onclick=cycleTheme;document.getElementById("gr").onclick=openSettings;document.getElementById("bk0").onclick=()=>{P.phase="home";render()};
    app.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{const d=slotData(+b.dataset.load);if(!d)return;S=d;S.run=false;SETUP=null;(S.staff||[]).forEach(s=>USED.add(s.n));render();window.scrollTo(0,0);autoLoop()});
    app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const n=+b.dataset.del;openModal(`<h3 class="ev-t">effacer cette agence ?</h3><p class="ev-x">La partie de l’emplacement ${n} sera perdue.</p><div class="acts"><button class="btn" id="dy">effacer</button><button class="btn ghost" id="cl">garder</button></div>`);document.getElementById("dy").onclick=()=>{try{localStorage.removeItem(KEY+"-"+n)}catch(e){}closeModal();render()};document.getElementById("cl").onclick=()=>closeModal()});
    app.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>{P.slot=+b.dataset.new;P.phase="steps";P.step=1;render();window.scrollTo(0,0)});return}
  const N=11,names=["","Votre nom","Qui êtes-vous","Le nom de l’agence","La typographie","La couleur","La signature","Le métier","La ville","L’argent","L’édition","C’est parti"];
  const ag=P.ag;const preview=`<div class="preview">${agMast(Math.round(Math.min(54,620/Math.max(7,ag.name.length)))+"px")}<div class="kicker" style="margin-top:8px">${esc(ag.slogan)}</div></div>`;
  let body="";
  switch(P.step){
   case 1:body=`<h1 class="q">comment vous appelez-vous ?</h1>${bubble("« Alors, tu te lances ? Commence par me rappeler ton nom, que je le dise à tout Paris. »")}<input class="tx" type="text" id="nm" value="${esc(P.name)}" maxlength="32" placeholder="Prénom et nom" autocomplete="name">`;break;
   case 2:body=`<h1 class="q">qui êtes-vous ?</h1><div class="seg"><button data-gender="f" class="${P.g==="f"?"on":""}">Une femme</button><button data-gender="m" class="${P.g!=="f"?"on":""}">Un homme</button></div><div class="avstick">${fc(P.av,78,"xl")}</div>
     ${avRow("Teint","sk",SKINS)}${avRow("Coiffure","hs",HSTY.filter(([k])=>P.g==="f"?k!=="chauve":true))}${avRow("Cheveux","hc",HCOL)}${avRow("Lunettes","gl",[[0,"Aucune"],[1,"Rondes"],[2,"Carrées"]])}${P.g==="m"?avRow("Barbe","bd",[[0,"Aucune"],[1,"Fournie"],[2,"Trois jours"],[3,"Moustache"]]):""}${avRow("Veste","sh",SHIRTS)}${avRow("Fond","bg",AVBG)}`;break;
   case 3:{const pg=(P.npage||0)*6%NAMESUG.length;body=`<h1 class="q">comment s’appelle votre agence ?</h1>${bubble("« Un nom court. Que le standard puisse le dire sans bafouiller. »")}<div class="choices">${NAMESUG.slice(pg,pg+6).map(n=>`<button class="ch${ag.name===n&&!P.custom?" sel":""}" data-nm="${esc(n)}"><b>${esc(n)}</b></button>`).join("")}</div><div class="acts"><button class="btn ghost" id="more">d’autres idées</button></div><div class="acts"><input class="tx" type="text" id="cu" maxlength="26" placeholder="Ou votre propre nom" value="${esc(P.custom)}" style="flex:1;min-width:0"><button class="btn ghost" id="cuok">choisir</button></div>`;break}
   case 4:body=`<h1 class="q">quelle typographie ?</h1>${bubble("« C’est la première chose que tu vas vendre : ton propre logo. Ne le rate pas. »")}<div class="choices">${Object.entries(FONTS).map(([k,f])=>`<button class="ch${ag.font===k?" sel":""}" data-fo="${k}"><b>${agMastFor(Object.assign({},ag,{font:k}),"26px","var(--acct)")}</b><span>${f[0]}</span></button>`).join("")}</div>`;break;
   case 5:body=`<h1 class="q">quelle couleur ?</h1>${bubble("« Elle sera sur tes cartes, tes présentations et tes factures. Surtout sur tes factures. »")}<div class="choices">${Object.entries(COLORS).map(([k,[n,c]])=>`<button class="ch${ag.color===k?" sel":""}" data-co="${k}"><b><span class="lt">${agMastFor(ag,"26px",c)}</span></b><span>${n}</span></button>`).join("")}</div>`;break;
   case 6:body=`<h1 class="q">quelle signature ?</h1>${bubble("« La phrase sous le logo. Tu la répéteras dans chaque compétition. »")}<div class="choices">${SLOGANS.map(s=>`<button class="ch${ag.slogan===s&&!P.customS?" sel":""}" data-sl="${esc(s)}"><b>${esc(s)}</b></button>`).join("")}</div><div class="acts"><input class="tx" type="text" id="cs" maxlength="44" placeholder="Ou votre propre signature" value="${esc(P.customS)}" style="flex:1;min-width:0"><button class="btn ghost" id="csok">choisir</button></div>`;break;
   case 7:body=`<h1 class="q">quel métier ?</h1>${bubble("« On ne peut pas tout faire. Enfin si, mais alors on le dit. »")}<div class="choices">${Object.entries(POSITIONS).map(([k,p])=>`<button class="ch${ag.pos===k?" sel":""}" data-po="${k}"><b>${p[0]}</b><span>${esc(p[1])}</span></button>`).join("")}</div>`;break;
   case 8:body=`<h1 class="q">dans quelle ville ?</h1>${bubble("« Paris, c’est le marché. Ailleurs, c’est le loyer. À toi de voir. »")}<div class="choices">${Object.entries(CITIES).map(([k,c])=>`<button class="ch${ag.city===k?" sel":""}" data-ci="${k}"><b>${c[0]}</b><span>${esc(c[3])} Coworking : ${eur(Math.round(OFFICES.cowork[2]*c[1]))} par mois.</span></button>`).join("")}</div>`;break;
   case 9:body=`<h1 class="q">avec quel argent ?</h1>${bubble("« La première année, une agence brûle de l’argent avant d’en gagner. Combien tu as de carburant ? »")}<div class="choices">${Object.entries(FINANCE).map(([k,f])=>`<button class="ch${P.fin===k?" sel":""}" data-fi="${k}"><b>${f[0]} · ${eur(f[1])}</b><span>${esc(f[3])}</span></button>`).join("")}</div>`;break;
   case 10:body=`<h1 class="q">quelle édition ?</h1><div class="choices">${Object.entries(EDITIONS).map(([k,e])=>`<button class="ch${P.mode===k?" sel":""}" data-md="${k}"><b>${e[0]}</b><span>${esc(e[1])}</span></button>`).join("")}</div>
     <h1 class="q" style="margin-top:22px">quelle difficulté ?</h1><div class="choices">${Object.entries(DIFFS).map(([k,d])=>`<button class="ch${P.diff===k?" sel":""}" data-df="${k}"><b>${d[0]}</b><span>${esc(d[1])}</span></button>`).join("")}</div>`;break;
   case 11:body=`<h1 class="q">votre agence est prête.</h1>${bubble(`« ${esc(ag.name)}. ${esc(ag.slogan)} J’ai déjà parlé de toi à un ancien client. Il t’appelle lundi. »`)}
     <div class="idcard"><div class="idmast">${agMastFor(ag,"clamp(34px,10vw,58px)")}<div class="kicker" style="margin-top:6px">${esc(ag.slogan)}</div></div><div class="idgrid"><div><small>Direction</small><b>${esc(P.name)}</b></div><div><small>Ville</small><b>${CITIES[ag.city][0]}</b></div><div><small>Métier</small><b>${POSITIONS[ag.pos][0]}</b></div><div><small>Départ</small><b>${eur(FINANCE[P.fin][1])}</b></div><div><small>Édition</small><b>${EDITIONS[P.mode][0].replace("Édition ","")}</b></div><div><small>Difficulté</small><b>${DIFFS[P.diff][0]}</b></div></div></div>
     <div class="card" style="display:flex;gap:12px;align-items:center;margin-top:12px">${fc(P.av,82,"l")}<div><div class="kicker">${P.g==="f"?"Fondatrice":"Fondateur"}</div><div style="font:700 24px/1.1 var(--f-ui);letter-spacing:-.04em">${esc(P.name)}</div></div></div>
     <button class="btn" id="go" style="width:100%;margin-top:16px;font-size:18px;padding:16px">ouvrir l’agence</button>`;break}
  app.innerHTML=`<div class="screen"><div class="wrap"><div class="screen-top"><div class="kicker">Étape ${P.step} sur ${N} · ${names[P.step]}</div>${thm}</div>
   <div class="steps">${Array.from({length:N},(_,i)=>`<i class="${i<P.step?"on":""}"></i>`).join("")}</div>
   ${P.step>=3&&P.step<=6?preview:""}${body}${P.react?`<div class="result">${esc(P.react)}</div>`:""}
   ${P.step<N?`<div class="acts" style="margin-top:18px"><button class="btn ghost" id="bk">retour</button><button class="btn" id="nx">continuer</button></div>`:`<div class="acts"><button class="btn ghost" id="bk">retour</button></div>`}
   <div aria-hidden="true" style="position:absolute;left:-9999px;top:0">${Object.values(FONTS).map(f=>`<span style="font-family:${f[1].replace(/"/g,"'")};font-weight:${f[2]}">Aa</span>`).join("")}</div></div></div>`;
  const $=id=>document.getElementById(id);$("thm").onclick=cycleTheme;
  const nx=$("nx");if(nx)nx.onclick=()=>{if(P.step===1){const v=$("nm").value.trim();if(!v){toast("Entrez votre nom pour continuer");return}P.name=v}P.step++;P.react=null;render();window.scrollTo(0,0)};
  $("bk").onclick=()=>{if(P.step===1)P.phase="slots";else P.step--;P.react=null;render();window.scrollTo(0,0)};
  const nm=$("nm");if(nm){nm.oninput=()=>P.name=nm.value;nm.onkeydown=e=>{if(e.key==="Enter")nx.click()}}
  const sel=(attr,fn)=>app.querySelectorAll(`[${attr}]`).forEach(b=>b.onclick=()=>{fn(b.getAttribute(attr));render()});
  sel("data-gender",g=>{if(g===P.g)return;P.g=g;if(g==="f"){P.av.bd=0;if(["court","meche","chauve","rase"].includes(P.av.hs))P.av.hs="carre"}else if(["long","chignon","tresse","carre","frange","queue"].includes(P.av.hs))P.av.hs="court"});
  app.querySelectorAll("[data-avk]").forEach(b=>b.onclick=()=>{const k=b.dataset.avk;let v=b.dataset.avv;if(k==="gl"||k==="bd")v=+v;P.av[k]=v;const y=window.scrollY;render();window.scrollTo(0,y)});
  sel("data-bg",k=>{P.bg=k;P.react=BGS[k][2]});
  sel("data-nm",n=>{ag.name=n;P.custom=""});
  const mo=$("more");if(mo)mo.onclick=()=>{P.npage=(P.npage||0)+1;render()};
  const cu=$("cuok");if(cu)cu.onclick=()=>{const v=$("cu").value.trim();if(v){ag.name=v;P.custom=v;render()}};
  sel("data-fo",k=>ag.font=k);sel("data-co",k=>ag.color=k);
  sel("data-sl",s=>{ag.slogan=s;P.customS=""});
  const cs=$("csok");if(cs)cs.onclick=()=>{const v=$("cs").value.trim();if(v){ag.slogan=v;P.customS=v;render()}};
  sel("data-po",k=>{ag.pos=k;P.react={crea:"« Les prix, la gloire, et des nuits blanches. »",digital:"« Du récurrent. Ton banquier va t’aimer. »",rp:"« Le téléphone ne s’arrêtera jamais de sonner. »",global:"« Tout faire, c’est aussi tout savoir faire. »"}[k]});
  sel("data-ci",k=>ag.city=k);sel("data-fi",k=>P.fin=k);sel("data-md",k=>P.mode=k);sel("data-pc",k=>P.pace=k);sel("data-df",k=>P.diff=k);
  const go=$("go");if(go)go.onclick=()=>{newGame(P);SETUP=null;save();render();window.scrollTo(0,0)};
}
function agMastFor(ag,size,col){const F=FONTS[ag.font]||FONTS.helv;const t=F[4]?ag.name.toUpperCase():ag.name;return `<span style="font-family:${F[1].replace(/"/g,"'")};font-weight:${F[2]};letter-spacing:${F[3]};font-size:${size};color:${col||COLORS[ag.color][1]};line-height:1.05;white-space:nowrap">${esc(t)}</span>`}
agMast=function(size,col){return agMastFor((S||SETUP).ag,size,col)};

/* =================== Démarrage =================== */
try{applyTheme()}catch(e){}
render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoLoop()});

</script>
</body>
</html>
